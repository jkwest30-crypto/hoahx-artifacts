[build]
  publish = "go-live"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/decisions"
  to = "/.netlify/functions/decisions"
  status = 200
  force = true

# The site's root serves the owners' open questions page (the same page as /answers), without
# changing what appears in the browser's address bar. The decision register is an internal
# tool: it stays at /decision-register/decision-register.html and nothing links to it.
[[redirects]]
  from = "/"
  to = "/answers/index.html"
  status = 200

# Serve the workflow map at /workflow-map, without changing what appears in
# the browser's address bar. The page is static; it has no shared store.
[[redirects]]
  from = "/workflow-map"
  to = "/workflow-map/workflow-map.html"
  status = 200

[[redirects]]
  from = "/workflow-map/"
  to = "/workflow-map/workflow-map.html"
  status = 200

# HOAhx · Beyond the proposal: the recommendation, the packages, the features, and
# the review page under /scope/, with their shared store at /api/picks.
[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true

[[redirects]]
  from = "/scope"
  to = "/scope/index.html"
  status = 200

# HOAhx · Your open questions: every question still waiting on the owners, answered Agree,
# Change or Discuss, and where each new screen stands. Served at / and at /answers, with its
# shared store at /api/answers.
[[redirects]]
  from = "/api/answers"
  to = "/.netlify/functions/answers"
  status = 200
  force = true

[[redirects]]
  from = "/answers"
  to = "/answers/index.html"
  status = 200

# HOAhx · Hub: the owners' front door, at /hub. Links to the documents in the shared Google
# Drive and to the review pages on this site. Static; it has no shared store.
[[redirects]]
  from = "/hub"
  to = "/hub/index.html"
  status = 200
