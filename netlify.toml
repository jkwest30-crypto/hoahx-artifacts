[build]
  publish = "go-live"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/decisions"
  to = "/.netlify/functions/decisions"
  status = 200
  force = true

# The site's root serves the owners' open questions page (the same page as /answers), without
# changing what appears in the browser's address bar. The decision register is an internal
# tool: it stays at /decision-register/decision-register.html and nothing links to it.
[[redirects]]
  from = "/"
  to = "/answers/index.html"
  status = 200

# Serve the workflow map at /workflow-map, without changing what appears in
# the browser's address bar. The page is static; it has no shared store.
[[redirects]]
  from = "/workflow-map"
  to = "/workflow-map/workflow-map.html"
  status = 200

[[redirects]]
  from = "/workflow-map/"
  to = "/workflow-map/workflow-map.html"
  status = 200

# Beyond the proposal (/scope/) was taken down on 2026-09-28. The owners have used its address,
# so a bookmark or an old link leads to the hub rather than to "Page not found".
[[redirects]]
  from = "/scope"
  to = "/hub"
  status = 302
  force = true

[[redirects]]
  from = "/scope/*"
  to = "/hub"
  status = 302
  force = true

# HOAhx · Your open questions: every question still waiting on the owners, answered Agree,
# Change or Discuss, and where each new screen stands. Served at / and at /answers, with its
# shared store at /api/answers.
[[redirects]]
  from = "/api/answers"
  to = "/.netlify/functions/answers"
  status = 200
  force = true

[[redirects]]
  from = "/answers"
  to = "/answers/index.html"
  status = 200

# HOAhx · Hub: the owners' front door, at /hub. Links to the documents in the shared Google
# Drive and to the review pages on this site. Static; it has no shared store.
[[redirects]]
  from = "/hub"
  to = "/hub/index.html"
  status = 200

# HOAhx · Videos to review: the owners' page at /videos (also a section on /answers) and Jacob's
# sign-off page at /videos/review (linked from nowhere), with their shared store at /api/videos.
[[redirects]]
  from = "/api/videos"
  to = "/.netlify/functions/videos"
  status = 200
  force = true

[[redirects]]
  from = "/videos"
  to = "/videos/index.html"
  status = 200

[[redirects]]
  from = "/videos/review"
  to = "/videos/review/index.html"
  status = 200
