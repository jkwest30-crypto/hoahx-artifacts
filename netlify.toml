[build]
  publish = "go-live"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/decisions"
  to = "/.netlify/functions/decisions"
  status = 200
  force = true

# Serve the decision register at the site's root URL, without changing
# what appears in the browser's address bar.
[[redirects]]
  from = "/"
  to = "/decision-register/decision-register.html"
  status = 200

# Serve the workflow map at /workflow-map, without changing what appears in
# the browser's address bar. The page is static; it has no shared store.
[[redirects]]
  from = "/workflow-map"
  to = "/workflow-map/workflow-map.html"
  status = 200

[[redirects]]
  from = "/workflow-map/"
  to = "/workflow-map/workflow-map.html"
  status = 200

# HOAhx · Beyond the proposal: the recommendation, the packages, the features, and
# the review page under /scope/, with their shared store at /api/picks.
[[redirects]]
  from = "/api/picks"
  to = "/.netlify/functions/picks"
  status = 200
  force = true

[[redirects]]
  from = "/scope"
  to = "/scope/index.html"
  status = 200

# HOAhx · Open questions, answered by recommendation: the owners' Agree / Change page at
# /answers, with its shared store at /api/answers.
[[redirects]]
  from = "/api/answers"
  to = "/.netlify/functions/answers"
  status = 200
  force = true

[[redirects]]
  from = "/answers"
  to = "/answers/index.html"
  status = 200
