<style>
/* Layout: a header with one overall meter and a day slider, then one row per MVP feature (bar + %), each opening to its requirements. */
:root{
  --bg:#f5f7f6; --panel:#ffffff; --fg:#16201b; --muted:#5e6c64; --line:#dde5e0; --track:#e4eae6;
  --done:#1d8a56; --done-soft:#d6efe2; --mid:#3f9f73; --part:#c98a1a; --none:#b9c4be; --proj:#9fd6b9;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#151d19; --fg:#e4ece7; --muted:#97a69d; --line:#26322c; --track:#24302a;
  --done:#3fc382; --done-soft:#173a29; --mid:#2f9a68; --part:#e6a447; --none:#4b5a52; --proj:#2b6b4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#151d19; --fg:#e4ece7; --muted:#97a69d; --line:#26322c; --track:#24302a;
  --done:#3fc382; --done-soft:#173a29; --mid:#2f9a68; --part:#e6a447; --none:#4b5a52; --proj:#2b6b4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.4}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:22px 48px}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 14px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 22px}
.big{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--done);font-variant-numeric:tabular-nums}
.sum .k{color:var(--muted);font-size:13px}
.sum .when{margin-left:auto;text-align:right}
.sum .when b{font-size:16px}
.meter{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;background:var(--done);transition:width .25s ease}
.sl{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.play{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer;min-width:74px}
input[type=range]{width:100%;accent-color:var(--done);margin:0}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);grid-column:2;margin-top:-4px}
.ticks span{width:0;display:flex;justify-content:center;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.list{margin-top:10px;display:grid}
.f{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) minmax(90px,30%) 46px 92px;gap:12px;align-items:center;width:100%;padding:11px 0;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.car{color:var(--muted);font-size:11px;transition:transform .15s}
.f.open .car{transform:rotate(90deg)}
.nm{min-width:0;font-weight:500}
.eta{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.f.done .eta{color:var(--done)}
.eta.late{color:var(--part);font-weight:600}
.nm small{display:block;color:var(--muted);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .25s ease}
.pc{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.f.done .nm{font-weight:700}
.f.done .pc{color:var(--done)}
.chip{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--done);background:var(--done-soft);border-radius:4px;padding:0 6px;vertical-align:1px}
.reqs{list-style:none;margin:0 0 12px;padding:0 0 0 26px;display:grid;gap:5px}
.reqs .sh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:6px}
.rq{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:4px;border:1.5px solid var(--none)}
.dot.s2{background:var(--done);border-color:var(--done)}
.dot.s1{background:linear-gradient(90deg,var(--part) 50%,transparent 50%);border-color:var(--part)}
.dot.pj{background:var(--proj);border-color:var(--done);border-style:dashed}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;gap:6px;align-items:center}
.tools{display:flex;gap:8px;margin-left:auto}
.tools button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:5px;padding:3px 9px;cursor:pointer}
.rq .tx{min-width:0;overflow-wrap:anywhere}
/* Blockers: an open requirement's tickets not yet done, re-resolved at every build (run-day/blockers.py) */
.bk{margin-top:3px}
.bk summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);border-radius:4px;padding:2px 4px 2px 0;list-style:none;min-height:24px}
.bk summary::-webkit-details-marker{display:none}
.bk summary::before{content:"▸";font-size:10px;transition:transform .15s}
.bk[open] summary::before{transform:rotate(90deg)}
.bk summary:hover{color:var(--fg)}
.bk summary:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.bk summary .n{font-family:var(--mono);color:var(--part)}
.bk.none summary .n{color:var(--muted)}
.bk ul{list-style:none;margin:4px 0 6px;padding:6px 10px;display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.bk li{font-size:12.5px;line-height:1.4;overflow-wrap:anywhere}
.bk li b{font-family:var(--mono);font-size:11.5px;font-weight:600}
.bk .tg{display:inline-block;margin-left:6px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;white-space:nowrap}
.bk .tg.ow{color:var(--fg)}
.bk .empty{color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:12px minmax(0,1fr) 56px 38px 64px;gap:8px}.sum .when{margin-left:0;text-align:left}}
@media (prefers-reduced-motion:reduce){.bar i,.meter i{transition:none}}
</style>

const DATES={};{let d=new Date(2026,9,7),n=23;while(n<=81){const w=d.getDay();const hol=(d.getMonth()===10&&d.getDate()===26)||(d.getMonth()===11&&d.getDate()===25);if(w>0&&w<6&&!hol){DATES[n]=new Date(d);n++}d.setDate(d.getDate()+1)}}

 const rs=reqsBy[f.id]||[];const have=f.b+0.5*f.p;let units=p/100*f.n-have+1e-6;const out=new Set();

function etaFor(f){const k="a"+f.id;if(plan[NOW][k]>=99.9)return {t:"Done",late:false};

 for(const f of fs){const p=o["a"+f.id],done=p>=99.9;if(done)fin++;const pj=projected(f,p);const eta=etaFor(f);
  const nb=(reqsBy[f.id]||[]).filter(r=>r.s===2||pj.has(r.id)).length;built+=nb;tot+=f.n;
  const el=document.createElement("div");el.className="f"+(done?" done":"")+(open.has(f.id)?" open":"");
  const btn=document.createElement("button");btn.className="row";btn.setAttribute("aria-expanded",open.has(f.id));

  btn.onclick=()=>{open.has(f.id)?open.delete(f.id):open.add(f.id);render()};el.appendChild(btn);
  if(open.has(f.id)){const ul=document.createElement("ul");ul.className="reqs";let sub="";

    const li=document.createElement("li");li.className="rq";const c=r.s===2?"s2":pj.has(r.id)?"pj":r.s===1?"s1":"";

{const t=$("ticks");for(let d=NOW;d<=81;d++){const s=document.createElement("span");if(d===NOW||d===81||(d-NOW)%5===0&&d<79)s.textContent=d===NOW?"today":fmt(DATES[d],{month:"short",day:"numeric"});t.appendChild(s)}}
